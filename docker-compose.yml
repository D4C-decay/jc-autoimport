services:
  postgres:
    image: postgres:16-alpine
    container_name: jcauto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jcauto
      POSTGRES_PASSWORD: jcauto_password
      POSTGRES_DB: jcautoimport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jcauto -d jcautoimport"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jcauto-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jcauto-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://jcauto:jcauto_password@postgres:5432/jcautoimport?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata: