name: ci

# Integración continua del backend: build + lint + tests unitarios.
# Los e2e (test/*.e2e-spec.ts) quedan fuera a propósito: exigen PostgreSQL y
# Redis reales y se corren en local, no en este job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22 + caché npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # generated/ está en .gitignore, así que el cliente de Prisma hay que
      # generarlo antes de compilar/lintar/testear (el código lo importa).
      - name: Prisma generate
        run: npx prisma generate

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (nest build)
        run: npm run build

      - name: Tests unitarios (vitest)
        run: npm run test
